[project]
name = "verification-os"
version = "0.1.0"
description = "Hypothesis-verification engine for solo deeptech AI studios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
vos = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]
packages = ["vos_core", "harness", "harness.metrics", "harness.plugins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
